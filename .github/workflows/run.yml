name: VCB Daily Reports (Morning & EOD)
on:
  schedule:
    # Chạy lúc 06:00 UTC (8h sáng Pháp) từ Thứ 2 - Thứ 6
    - cron: '0 6 * * 1-5'
    # Chạy lúc 15:00 UTC (17h chiều Pháp) từ Thứ 2 - Thứ 6
    - cron: '0 15 * * 1-5'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cai dat thu vien
        run: |
          pip install vnstock requests pytz pandas
          
      - name: Chay bao cao
        run: python main.py
